
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Grid Column Start</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành grid-column-start</h1>

    <h2>Ví dụ 1: Giá trị auto</h2>
    <div class="grid-container grid-auto">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>

    <h2>Ví dụ 2: Giá trị span 2</h2>
    <div class="grid-container grid-span">
        <div class="item1">Item 1 - span 2</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

    <h2>Ví dụ 3: Giá trị column-line</h2>
    <div class="grid-container grid-line">
        <div class="item1">Item 1 - bắt đầu ở đường kẻ 2</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

</body>
</html>
